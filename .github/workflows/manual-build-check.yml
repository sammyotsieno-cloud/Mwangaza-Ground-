name: Manual Verification

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What should be verified?"
        required: true
        type: choice
        options:
          - build
          - lint
          - tests
          - full

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        if: inputs.target == 'build'
        run: ./gradlew build

      - name: Lint
        if: inputs.target == 'lint'
        run: ./gradlew lint

      - name: Tests
        if: inputs.target == 'tests'
        run: ./gradlew test

      - name: Full verification
        if: inputs.target == 'full'
        run: ./gradlew build lint test

      - name: Upload APK artifacts
        if: inputs.target == 'build' || inputs.target == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: mwangaza-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

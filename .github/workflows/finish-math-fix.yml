name: Finish Mwangaza Goods Money Tally

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: remove temporary tally workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact goods and money chain fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # ------------------------------------------------------------------
          # Shared money formatter at every RationalCost/Money display boundary
          # ------------------------------------------------------------------
          for rel in [
              'app/src/main/java/org/mwangaza/app/ui/screens/ReportsScreen.kt',
              'app/src/main/java/org/mwangaza/app/ui/screens/InventoryScreen.kt',
              'app/src/main/java/org/mwangaza/app/ui/screens/DispensingScreen.kt',
          ]:
              p = root / rel
              t = p.read_text()
              anchor = 'import org.mwangaza.app.data.AppContainer\n'
              imp = 'import org.mwangaza.app.ui.formatters.MoneyDisplayFormatter\n'
              if imp not in t:
                  if anchor not in t:
                      raise SystemExit(f'Cannot add formatter import to {rel}')
                  t = t.replace(anchor, anchor + imp, 1)

              # Delete any local RationalCost formatter, regardless of its exact
              # whitespace/comment form.
              t, n = re.subn(
                  r'\n(?:/\*\*.*?\*/\n)?private fun formatRationalCost\s*\(\s*cost:\s*RationalCost\s*\)\s*:\s*String\s*\{.*?\n\}\n',
                  '\n', t, count=1, flags=re.S
              )
              if n:
                  pass
              t = t.replace('formatRationalCost(', 'MoneyDisplayFormatter.formatRationalCost(')
              p.write_text(t)

          # Reports: revenue is settled Money, so use the same shared minor-unit
          # display formatter and remove the local duplicate.
          p = root / 'app/src/main/java/org/mwangaza/app/ui/screens/ReportsScreen.kt'
          t = p.read_text()
          t = re.sub(
              r'\n/\*\*\n \* Formats a settled Money value.*?\nprivate fun formatMinorUnits\(.*?\n\}\n',
              '\n', t, count=1, flags=re.S
          )
          t = t.replace('formatMinorUnits(', 'MoneyDisplayFormatter.formatMinorUnits(')
          t = t.replace('import java.math.BigDecimal\n', '').replace('import java.math.RoundingMode\n', '')
          p.write_text(t)

          # Dispensing: the ordinary Money display helper is also centralized.
          p = root / 'app/src/main/java/org/mwangaza/app/ui/screens/DispensingScreen.kt'
          t = p.read_text()
          t = re.sub(
              r'\nprivate fun formatMoney\(minorUnits: Long\): String \{.*?\n\}\n',
              '\n', t, count=1, flags=re.S
          )
          t = t.replace('formatMoney(', 'MoneyDisplayFormatter.formatMinorUnits(')
          t = t.replace('import java.math.BigDecimal\n', '').replace('import java.math.RoundingMode\n', '')

          # Exact sale-line money: physical quantity × minor-unit price.
          old = '''                        val lineTotalMinor = try {\n                            Math.multiplyExact(\n                                quantity.storageUnits,\n                                unitPriceMinor\n                            )\n                        } catch (e: ArithmeticException) {\n                            throw IllegalArgumentException(\n                                "Line total overflow for quantity=${quantity.storageUnits} " +\n                                    "and unit price=$unitPriceMinor",\n                                e\n                            )\n                        }'''
          new = '''                        val lineTotalProduct = try {\n                            Math.multiplyExact(\n                                quantity.storageUnits,\n                                unitPriceMinor\n                            )\n                        } catch (e: ArithmeticException) {\n                            throw IllegalArgumentException(\n                                "Line total overflow for quantity=${quantity.storageUnits} " +\n                                    "and unit price=$unitPriceMinor",\n                                e\n                            )\n                        }\n                        val scaleMultiplier = quantity.scale.multiplier\n                        require(scaleMultiplier > 0L) {\n                            "Quantity scale multiplier must be positive"\n                        }\n                        require(lineTotalProduct % scaleMultiplier == 0L) {\n                            "Selling total is not exactly representable in minor units: " +\n                                "quantity=${quantity.toPlainString()}, " +\n                                "unitPriceMinor=$unitPriceMinor"\n                        }\n                        val lineTotalMinor =\n                            lineTotalProduct / scaleMultiplier'''
          if old in t:
              t = t.replace(old, new, 1)
          elif 'val lineTotalMinor = try {' in t:
              raise SystemExit('Unexpected Dispensing line-total source shape')
          p.write_text(t)

          # ------------------------------------------------------------------
          # Persisted SaleItem total uses the same physical-quantity contract.
          # ------------------------------------------------------------------
          p = root / 'core/src/main/kotlin/core/domain/consumption/ConsumptionService.kt'
          t = p.read_text()
          old = '''                    /*\n                     * NOTE:\n                     * This multiplication remains based on the existing pricing\n                     * contract and is intentionally not redesigned in this repair.\n                     *\n                     * The scale-aware selling-price model will be corrected in\n                     * the dedicated quantity/pricing hardening step.\n                     */\n                    val lineSellingTotalMinor = Math.multiplyExact(\n                        lineReq.requestedQuantity.storageUnits,\n                        sellingPrice.amountMinorUnits\n                    )'''
          new = '''                    val lineSellingProduct = Math.multiplyExact(\n                        lineReq.requestedQuantity.storageUnits,\n                        sellingPrice.amountMinorUnits\n                    )\n                    val scaleMultiplier = lineReq.requestedQuantity.scale.multiplier\n                    require(scaleMultiplier > 0L) {\n                        "Quantity scale multiplier must be positive"\n                    }\n                    require(lineSellingProduct % scaleMultiplier == 0L) {\n                        "Selling total is not exactly representable in minor units: " +\n                            "quantity=${lineReq.requestedQuantity.toPlainString()}, " +\n                            "unitPriceMinor=${sellingPrice.amountMinorUnits}"\n                    }\n                    val lineSellingTotalMinor =\n                        lineSellingProduct / scaleMultiplier'''
          if old in t:
              t = t.replace(old, new, 1)
          elif 'val lineSellingTotalMinor = Math.multiplyExact(' in t:
              raise SystemExit('ConsumptionService line total exists but has an unexpected shape')
          p.write_text(t)

          # ------------------------------------------------------------------
          # Exact Money parsing for product prices.
          # ------------------------------------------------------------------
          p = root / 'app/src/main/java/org/mwangaza/app/ui/screens/ProductsScreen.kt'
          t = p.read_text()
          old = '''                        val priceParsed =\n                            initialPriceMajor.trim().toDoubleOrNull()\n\n                        if (\n                            priceParsed == null ||\n                            priceParsed < 0.0\n                        ) {\n                            errorMessage = "Initial price must be a valid non-negative number."\n                            return@Button\n                        }\n\n                        val priceMinor =\n                            Math.round(priceParsed * 100.0)'''
          new = '''                        val initialPrice = try {\n                            Money.fromDecimalString(\n                                initialPriceMajor.trim()\n                            )\n                        } catch (_: Exception) {\n                            errorMessage = "Initial price must be a valid non-negative amount."\n                            return@Button\n                        }\n\n                        if (initialPrice.amountMinorUnits < 0L) {\n                            errorMessage = "Initial price must be a valid non-negative amount."\n                            return@Button\n                        }\n\n                        val priceMinor =\n                            initialPrice.amountMinorUnits'''
          if old in t:
              t = t.replace(old, new, 1)
          elif 'initialPriceMajor.trim().toDoubleOrNull()' in t:
              raise SystemExit('ProductsScreen initial-price block shape changed unexpectedly')

          old = '''                        val parsedPrice =\n                            priceStr.trim().toDoubleOrNull()\n\n                        val priceMinor =\n                            if (\n                                parsedPrice != null &&\n                                parsedPrice >= 0.0\n                            ) {\n                                Math.round(parsedPrice * 100.0)\n                            } else {\n                                0L\n                            }'''
          new = '''                        val parsedPriceMinor = try {\n                            Money.fromDecimalString(\n                                priceStr.trim()\n                            ).amountMinorUnits\n                        } catch (_: Exception) {\n                            0L\n                        }\n\n                        val priceMinor =\n                            parsedPriceMinor'''
          if old in t:
              t = t.replace(old, new, 1)
          elif 'priceStr.trim().toDoubleOrNull()' in t:
              raise SystemExit('ProductsScreen commercial-price block shape changed unexpectedly')
          p.write_text(t)

          # ------------------------------------------------------------------
          # Physical quantity display formatter and UI wiring.
          # ------------------------------------------------------------------
          qfmt = root / 'app/src/main/java/org/mwangaza/app/ui/formatters/QuantityDisplayFormatter.kt'
          qfmt.parent.mkdir(parents=True, exist_ok=True)
          qfmt.write_text('''package org.mwangaza.app.ui.formatters\n\nimport core.domain.model.Quantity\n\n/** User-facing quantity formatting: physical quantity, never storage units. */\nobject QuantityDisplayFormatter {\n    fun format(quantity: Quantity, unitName: String? = null): String {\n        val value = quantity.toPlainString()\n        return if (unitName.isNullOrBlank()) value else "$value $unitName"\n    }\n}\n''')

          p = root / 'app/src/main/java/org/mwangaza/app/ui/screens/InventoryScreen.kt'
          t = p.read_text()
          if 'import core.domain.model.Quantity\n' not in t:
              t = t.replace('import core.domain.model.ProductMaster\n', 'import core.domain.model.ProductMaster\nimport core.domain.model.Quantity\n', 1)
          qimp = 'import org.mwangaza.app.ui.formatters.QuantityDisplayFormatter\n'
          if qimp not in t:
              t = t.replace('import org.mwangaza.app.ui.formatters.MoneyDisplayFormatter\n', 'import org.mwangaza.app.ui.formatters.MoneyDisplayFormatter\n' + qimp, 1)
          # On-hand card: convert the ledger storage integer back to the product's
          # physical scale before displaying it.
          t = t.replace(
              '"On Hand: ${summary.physicalStockUnits} $unitLabel"',
              '"On Hand: ${QuantityDisplayFormatter.format(Quantity(summary.physicalStockUnits, summary.product.quantityScale), unitLabel)}"'
          )
          # Movement ledger: movement.quantity already carries its authoritative scale.
          t = t.replace(
              '"${movement.quantity.storageUnits} units",',
              'QuantityDisplayFormatter.format(\n                                                        movement.quantity,\n                                                        "base units"\n                                                    ),'
          )
          # Detail valuation call sites use the shared money formatter.
          t = t.replace('formatRationalCost(', 'MoneyDisplayFormatter.formatRationalCost(')
          t = t.replace('import java.math.BigDecimal\n', '').replace('import java.math.RoundingMode\n', '')
          p.write_text(t)

          # Expiry alerts also expose on-hand quantities to users; make them physical.
          p = root / 'app/src/main/java/org/mwangaza/app/ui/screens/ExpiryAlertsScreen.kt'
          t = p.read_text()
          if 'import core.domain.model.Quantity\n' not in t:
              t = t.replace('import core.domain.model.ProductMaster\n', 'import core.domain.model.ProductMaster\nimport core.domain.model.Quantity\n', 1)
          if qimp not in t:
              t = t.replace('import org.mwangaza.app.data.AppContainer\n', 'import org.mwangaza.app.data.AppContainer\n' + qimp, 1)
          t = t.replace(
              '"Stock On Hand: ${item.physicalStockUnits} units"',
              '"Stock On Hand: ${QuantityDisplayFormatter.format(Quantity(item.physicalStockUnits, item.product?.quantityScale ?: core.domain.model.QuantityScale.SCALE_0), "base units")}"'
          )
          p.write_text(t)

          # ------------------------------------------------------------------
          # Focused tests for the tally contract.
          # ------------------------------------------------------------------
          p = root / 'app/src/test/kotlin/org/mwangaza/app/ui/formatters/MoneyDisplayFormatterTest.kt'
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''package org.mwangaza.app.ui.formatters\n\nimport core.domain.model.RationalCost\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\nimport java.math.BigInteger\n\nclass MoneyDisplayFormatterTest {\n    @Test\n    fun `rational cost 10000 minor units displays as KES 100 point 00`() {\n        val cost = RationalCost(BigInteger.valueOf(10000L), BigInteger.ONE)\n        assertEquals(\"KES 100.00\", MoneyDisplayFormatter.formatRationalCost(cost))\n    }\n}\n''')

          p = root / 'core/src/test/kotlin/core/domain/consumption/SaleLineTotalMathTest.kt'
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''package core.domain.consumption\n\nimport core.domain.model.Quantity\nimport core.domain.model.QuantityScale\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass SaleLineTotalMathTest {\n    private fun total(quantity: Quantity, unitPriceMinor: Long): Long {\n        val product = Math.multiplyExact(quantity.storageUnits, unitPriceMinor)\n        val divisor = quantity.scale.multiplier\n        require(product % divisor == 0L)\n        return product / divisor\n    }\n\n    @Test\n    fun `scale one 2 point 5 units at KES 10 equals 2500 minor units`() {\n        assertEquals(2500L, total(Quantity(25L, QuantityScale.SCALE_1), 1000L))\n    }\n\n    @Test\n    fun `scale zero 3 units at KES 10 equals 3000 minor units`() {\n        assertEquals(3000L, total(Quantity(3L, QuantityScale.SCALE_0), 1000L))\n    }\n\n    @Test\n    fun `scale one storage 25 displays as physical 2 point 5`() {\n        assertEquals(\"2.5\", Quantity(25L, QuantityScale.SCALE_1).toPlainString())\n    }\n}\n''')

          # Repo-wide source guards for the mandatory repair.
          kotlin_files = list(root.rglob('*.kt'))
          all_text = '\n'.join(p.read_text() for p in kotlin_files)
          if re.search(r'private fun formatRationalCost', all_text):
              raise SystemExit('private formatRationalCost copy remains')
          for bad in ['initialPriceMajor.trim().toDoubleOrNull()', 'priceStr.trim().toDoubleOrNull()']:
              if bad in all_text:
                  raise SystemExit(f'Double money parsing remains: {bad}')

          valuation = (root / 'core/src/main/kotlin/core/domain/reporting/InventoryValuationService.kt').read_text()
          if 'remainingQuantity.scale.multiplier' not in valuation:
              raise SystemExit('Inventory valuation scale denominator missing')

          inv = (root / 'app/src/main/java/org/mwangaza/app/ui/screens/InventoryScreen.kt').read_text()
          if 'movement.quantity.storageUnits} units' in inv:
              raise SystemExit('Inventory movement ledger still displays raw storage units')
          if '"On Hand: ${summary.physicalStockUnits}' in inv:
              raise SystemExit('Inventory on-hand still displays raw storage units')

      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app core
          git commit -m 'fix: tally goods quantities and money end to end' || exit 0
          git push

      - name: Verify tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Remove temporary workflow after successful verification
        if: success()
        run: |
          git rm .github/workflows/finish-math-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary tally workflow'
          git push
